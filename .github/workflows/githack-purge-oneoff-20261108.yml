name: One-time GitHack cache purge
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/githack-purge-oneoff-20261108.yml'
permissions:
  contents: read
jobs:
  purge-old-soxl-file:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge cached public HTML only
        shell: bash
        env:
          TARGET: https://raw.githack.com/passionelee/test/main/soxl-a05-v2/index.html
        run: |
          set -euo pipefail
          echo 'Purging exact retired GitHack URL (no strategy data uploaded).'
          status=$(curl --silent --show-error --location --connect-timeout 10 --max-time 45 --retry 2 --output /tmp/githack-purge-response.txt --write-out '%{http_code}' -X DELETE --get --data-urlencode "url=$TARGET" 'https://raw.githack.com/purge')
          echo "Purge response HTTP status: $status"
          if [ "$status" != '200' ]; then head -c 200 /tmp/githack-purge-response.txt; exit 1; fi
      - name: Confirm retired development URL no longer serves old dashboard
        shell: bash
        env:
          TARGET: https://raw.githack.com/passionelee/test/main/soxl-a05-v2/index.html
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            status=$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 --output /tmp/githack-page-response.txt --write-out '%{http_code}' "$TARGET")
            echo "Post-purge check $i: HTTP $status"
            if [ "$status" = '404' ] || [ "$status" = '410' ]; then exit 0; fi
            if [ "$status" = '200' ] && grep -Eiq 'SOXL A\+0\.5|model-data|SOXL_A05_v2' /tmp/githack-page-response.txt; then
              echo 'Old dashboard content still visible';
            else
              echo 'No evidence of old dashboard content, but exact 404 not confirmed';
            fi
            sleep 5
          done
          echo 'Unable to confirm 404 after purge'; exit 1

name: Minervini Korea Backtest

on:
  push:
    paths:
      - 'minervini_korea/run_backtest.py'
      - 'minervini_korea/config.yaml'
      - '.github/workflows/minervini-korea.yml'
  workflow_dispatch:

concurrency:
  group: minervini-korea-backtest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow pyyaml tabulate
      - name: Run Korean equity backtest
        run: python minervini_korea/run_backtest.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minervini_korea/results minervini_korea/data_manifest.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update Minervini Korea backtest results'
            git push
          fi

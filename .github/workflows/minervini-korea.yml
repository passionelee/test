name: Minervini Korea Backtest

on:
  push:
    paths:
      - 'minervini_korea/run_backtest.py'
      - 'minervini_korea/run_backtest_fast.py'
      - 'minervini_korea/run_backtest_v2.py'
      - 'minervini_korea/config.yaml'
      - '.github/workflows/minervini-korea.yml'
  workflow_dispatch:

concurrency:
  group: minervini-korea-backtest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas numpy pyarrow pyyaml tabulate
      - name: Fetch only required KRX yearly files
        run: |
          mkdir -p minervini_korea/external
          git clone --depth 1 --filter=blob:none --sparse https://github.com/FinanceData/marcap.git minervini_korea/external/marcap
          cd minervini_korea/external/marcap
          git sparse-checkout set --no-cone \
            data/marcap-2014.parquet data/marcap-2015.parquet data/marcap-2016.parquet \
            data/marcap-2017.parquet data/marcap-2018.parquet data/marcap-2019.parquet \
            data/marcap-2020.parquet data/marcap-2021.parquet data/marcap-2022.parquet \
            data/marcap-2023.parquet data/marcap-2024.parquet data/marcap-2025.parquet \
            data/marcap-2026.parquet
      - name: Run V2 Korean equity research loop
        run: python minervini_korea/run_backtest_v2.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minervini_korea/results_v2 || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update Minervini Korea V2 results'
            git push
          fi
